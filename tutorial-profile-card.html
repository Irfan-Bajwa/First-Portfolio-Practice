<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="profile-card-body">
    <div class="profile-card">
        <div class="info-box">
            <img src="Assets\irfan pic.jpg" alt="Irfan Profiles Picture" />

            <div class="info">
                <h2>Irfan Ellahi</h2>
                <p>Software Engineer</p>
            </div>
        </div>

        <div class="social-grid-box">
            <div class="box">
                <p>5</p>
                <p>Posts</p>
            </div>

            <div class="box">
                <p>10k</p>
                <p>Followers</p>
            </div>

            <div class="box">
                <p>50</p>
                <p>Following</p>
            </div>

        </div>

        <div class="btn-box">

            <button class="follow-btn">Follow</button>
            <button class="message-btn">Message</button>

        </div>

    </div>

</body>
</html>
