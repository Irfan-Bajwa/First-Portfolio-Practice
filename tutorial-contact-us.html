<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="view-port" content="width=device-width, initial-scale=1.0">
        <title>Tutorial Cotact Form</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body class="contact-body">
        <div class="form">
            <div class="head">
                <h1>Contact Us</h1>
            </div>

            <form action="" class="main-form">

                <div class="input">
                    <input type="text" name="name" placeholder="Enter Name" />
                </div>

                <div class="input">
                    <input type="tel" name="phone" placeholder="Phone Number" />
                </div>

                <div class="input">
                    <input type="email" name="email" placeholder="abc123@mail.com" />
                </div>

                <div class="input">
                    <textarea name="comment" placeholder="Enter Your Message" cols="" rows="5"></textarea>
                </div>

                <div class="input">
                    <button type="submit">Submit</button>
                </div>

            </form>
            
        
        </div>
    </body>
